services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thiagos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thiagos}
      POSTGRES_DB: ${POSTGRES_DB:-thiagos_db}
    ports:
      - "9000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thiagos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-thiagos}:${POSTGRES_PASSWORD:-thiagos}@db:5432/${POSTGRES_DB:-thiagos_db}?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
